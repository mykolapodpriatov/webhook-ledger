name: webhook-ledger

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: webhook_ledger
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d webhook_ledger']
      interval: 2s
      timeout: 5s
      retries: 20
